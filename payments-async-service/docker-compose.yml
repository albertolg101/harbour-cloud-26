services:
  shard0:
    image: postgres:16
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee
    ports:
      - "5433:5432"
    volumes:
      - shard0data:/var/lib/postgresql/data

  shard1:
    image: postgres:16
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee
    ports:
      - "5434:5432"
    volumes:
      - shard1data:/var/lib/postgresql/data

volumes:
  shard0data:
  shard1data:
